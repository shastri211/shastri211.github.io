name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a dead link is found before a reader finds it.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Text contrast
        run: npm run check:contrast
      - name: Links, including every code permalink and its line range
        run: npm run check:links
        env:
          GITHUB_TOKEN: ${{ github.token }}
